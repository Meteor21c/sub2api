# Legacy browser entry point. Collection and alerts use private endpoints.
server {
    listen 80;
    listen [::]:80;
    server_name monitor.meteor21c.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.meteor21c.fun;

    ssl_certificate     /etc/nginx/ssl/monitor.meteor21c.fun/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/monitor.meteor21c.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:METEOR_MONITOR_SSL:10m;
    ssl_session_timeout 1d;

    location = / {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 303 https://api.meteor21c.fun/admin/business-monitor;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/monitor.meteor21c.fun.access.log main;
    error_log /var/log/nginx/monitor.meteor21c.fun.error.log warn;
}

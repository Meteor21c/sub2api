name: Build Meteor Image

on:
  push:
    branches:
      - codex/payment-fee-tiers-channel-test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: meteor-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/meteor21c/sub2api
          tags: |
            type=raw,value=meteor-latest
            type=sha,prefix=meteor-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=meteor-sub2api
          cache-to: type=gha,mode=max,scope=meteor-sub2api

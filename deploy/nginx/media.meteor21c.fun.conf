# URI paths contain short-lived encrypted capabilities, so omit paths and query
# strings from access logs. Application errors also never include provider URLs.
log_format meteor_media_summary '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name media.meteor21c.fun;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/meteor-media-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://media.meteor21c.fun$request_uri; }
}

server {
    listen 443 ssl;
    server_name media.meteor21c.fun;
    ssl_certificate /etc/letsencrypt/live/media.meteor21c.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.meteor21c.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/meteor-media-access.log meteor_media_summary;
    error_log /dev/null crit;
    large_client_header_buffers 2 16k;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        proxy_pass http://127.0.0.1:3103;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
    location ^~ /v1/video/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        send_timeout 90s;
    }
    location / { return 404; }
}

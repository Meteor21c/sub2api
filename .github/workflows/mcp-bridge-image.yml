name: Build MCP Bridge Image

on:
  push:
    branches:
      - codex/mcp-bridge-storage-expiry
    paths:
      - deploy/mcp-bridge/**
      - .github/workflows/mcp-bridge-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mcp-bridge-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test bridge
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bridge tests
        working-directory: deploy/mcp-bridge
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/meteor21c/sub2api
          tags: |
            type=sha,prefix=mcpbridge-,format=short

      - name: Build and push MCP bridge
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/mcp-bridge
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=meteor-mcp-bridge
          cache-to: type=gha,mode=max,scope=meteor-mcp-bridge

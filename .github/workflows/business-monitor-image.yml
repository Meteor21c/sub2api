name: Build Business Monitor Image

on:
  push:
    branches: [codex/business-monitor, codex/server-safety-media-cache-20261028, codex/registration-schedule-20261028]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: business-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: business-ci
          POSTGRES_DB: business_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Validate standalone finance migration
        env:
          PGPASSWORD: business-ci
        run: |
          psql -h localhost -U postgres -d business_ci -v ON_ERROR_STOP=1 -f backend/migrations/247_business_monitor.sql
          psql -h localhost -U postgres -d business_ci -v ON_ERROR_STOP=1 -f backend/migrations/247_business_monitor.sql
      - name: Finance calculation, database and authorization tests
        working-directory: backend
        env:
          BUSINESS_MONITOR_TEST_DSN: postgres://postgres:business-ci@localhost:5432/business_ci?sslmode=disable
        run: go test -tags unit ./cmd/server ./internal/service ./internal/handler/admin -run '^TestBusinessMonitor|^TestProvideCleanup' -count=1 -timeout=5m
      - name: Validate canvas metadata migration twice
        env:
          PGPASSWORD: business-ci
        run: |
          psql -h localhost -U postgres -d business_ci -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS users(id BIGINT PRIMARY KEY)'
          psql -h localhost -U postgres -d business_ci -v ON_ERROR_STOP=1 -f backend/migrations/249_canvas_pilot_projects.sql
          psql -h localhost -U postgres -d business_ci -v ON_ERROR_STOP=1 -f backend/migrations/249_canvas_pilot_projects.sql
      - name: Canvas owner isolation, revision conflicts and quota transactions
        working-directory: backend
        env:
          CANVAS_PILOT_TEST_DSN: postgres://postgres:business-ci@localhost:5432/business_ci?sslmode=disable
        run: go test -tags unit ./internal/service ./internal/handler -run '^TestCanvas' -count=1 -timeout=5m
      - name: Registration policy, settings and OAuth entrypoint tests
        working-directory: backend
        run: |
          go test -tags unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/server -run 'Registration|OAuth|Setting|TestAPIContracts' -count=1 -timeout=5m
          go test -tags embed internal/web/html_cache.go internal/web/registration_cache_test.go -count=1
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Registration schedule and legacy balance navigation tests
        working-directory: frontend
        run: pnpm exec vitest run src/views/admin/__tests__/SettingsView.spec.ts src/views/auth/__tests__/RegisterView.spec.ts src/views/user/__tests__/CustomPageView.spec.ts src/views/user/__tests__/CustomPageView.race.spec.ts src/utils/__tests__/customMenuNavigation.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts
      - name: Finance frontend tests
        working-directory: frontend
        run: pnpm exec vitest run src/views/admin/__tests__/businessMonitor.spec.ts src/views/admin/__tests__/businessMonitorBalances.spec.ts
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable image tag
        id: tag
        run: echo "image=ghcr.io/meteor21c/sub2api:meteor-business-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=meteor-sub2api
          cache-to: type=gha,mode=max,scope=meteor-sub2api
